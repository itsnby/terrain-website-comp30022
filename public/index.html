<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=UA-142738771-1"
    ></script>

    <!-- Calendly widget styles and script -->
    <link
      href="https://assets.calendly.com/assets/external/widget.css"
      rel="stylesheet"
    />
    <script
      src="https://assets.calendly.com/assets/external/widget.js"
      type="text/javascript"
      async
    ></script>

    <!-- Klaviyo -->
    <script
      type="text/javascript"
      src="https://static.klaviyo.com/onsite/js/klaviyo.js?company_id=VrUvak"
    ></script>

    <link rel="icon" href="/black-white2.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- SEO -->
    <meta
      name="description"
      content="TERRAIN is a bookshop, gallery, and studio exploring ecological futures through art, design, and literacy in Ngár-go/Fitzroy on Wurundjeri Country."
    />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:title" content="TERRAIN" />
    <meta
      property="og:description"
      content="Explore ecological books, events, and design for a more-than-human future at TERRAIN in Ngár-go/Fitzroy."
    />
    <meta property="og:image" content="https://staging-terrain-14b4b.web.app/med-bookshop_img2.jpg" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="1066" />
    <meta property="og:url" content="https://terrain.earth" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TERRAIN" />
    <meta
      name="twitter:description"
      content="TERRAIN is Melbourne’s destination for ecological and more-than-human literature, design, art, community and ideas."
    />
    <meta name="twitter:image" content="https://staging-terrain-14b4b.web.app/med-bookshop_img2.jpg" />

    <title>TERRAIN</title>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
